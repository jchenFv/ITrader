[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "itrader"
version = "0.1.0"
description = "News-driven US technology stock paper-trading agent"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
itrader = "itrader.cli:main"
itrader-gui = "itrader.gui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
